name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax-check all extension scripts
        run: |
          node --check background.js
          for f in js/popup.js js/modules/*.js; do node --check "$f"; done

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build extension ZIP
        run: python scripts/build/build.py
      - name: Verify manifest is valid JSON
        run: python -c "import json; json.load(open('manifest.json'))"
